name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketflow_test
          POSTGRES_USER: marketflow
          POSTGRES_PASSWORD: marketflow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U marketflow -d marketflow_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      MARKETFLOW_TEST_DB: Host=localhost;Port=5433;Database=marketflow_test;Username=marketflow;Password=marketflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MarketFlow.sln
      - run: dotnet build MarketFlow.sln --no-restore
      - run: dotnet test MarketFlow.sln --no-build
      - run: docker build --tag marketflow-api .
