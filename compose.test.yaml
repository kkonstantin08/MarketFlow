name: marketflow-test

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketflow_test
      POSTGRES_USER: marketflow
      POSTGRES_PASSWORD: marketflow
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketflow -d marketflow_test"]
      interval: 2s
      timeout: 3s
      retries: 15
